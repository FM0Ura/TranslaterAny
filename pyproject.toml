[project]
name = "translaterany"
version = "0.1.0"
description = "Tradução de legendas de anime EN → PT-BR com IA, em múltiplas etapas"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "charset-normalizer>=3.5.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=0.0.1",
    "pysubs2>=1.9.0",
    "ruamel-yaml>=0.18.0",
    "tenacity>=9.0.0",
    "typer>=0.27.2",
]

[project.scripts]
translaterany = "translaterany.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
