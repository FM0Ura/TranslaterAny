<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TranslaterAny - Tradução de Legendas com IA{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/sse.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(55, 65, 81, 0.5); }
        .glow-accent { box-shadow: 0 0 20px -5px rgba(99, 102, 241, 0.3); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between" hx-ext="sse">

    <!-- Navbar -->
    <header class="border-b border-gray-800 bg-gray-900 bg-opacity-80 backdrop-filter backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <a href="/" class="flex items-center space-x-3 text-indigo-400 font-bold text-xl tracking-tight hover:text-indigo-300">
                    <span class="text-2xl">✨</span>
                    <span>TranslaterAny</span>
                </a>
                <nav class="hidden md:flex space-x-2">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'dashboard' %}bg-gray-800 text-indigo-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">Biblioteca</a>
                    <a href="/pipeline" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'pipeline' %}bg-gray-800 text-indigo-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">Pipeline</a>
                    <a href="/settings" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'settings' %}bg-gray-800 text-indigo-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">Configurações</a>
                </nav>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleJobDrawer()" class="relative p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition" title="Tarefas em Execução">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    <span id="active-jobs-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-indigo-500 rounded-full animate-ping"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Drawer de Jobs em Execução (Lateral Direita) -->
    <div id="job-drawer" class="fixed inset-y-0 right-0 max-w-md w-full bg-gray-900 border-l border-gray-800 transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col shadow-2xl">
        <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-950">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <h3 class="font-bold text-white text-base">Fila de Processamento</h3>
            </div>
            <button onclick="toggleJobDrawer()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
        </div>
        <div id="job-drawer-content" class="flex-grow overflow-y-auto p-4 space-y-4">
            <div class="text-center text-gray-500 text-sm py-8">Nenhum job em execução no momento.</div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-gray-800 bg-gray-950 py-6 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4">
            TranslaterAny v1.3.0 &bull; Processamento de legendas autônomo com IA &bull; Modo 100% Offline
        </div>
    </footer>

    <script>
        function toggleJobDrawer() {
            const drawer = document.getElementById('job-drawer');
            drawer.classList.toggle('translate-x-full');
        }
    </script>
</body>
</html>
