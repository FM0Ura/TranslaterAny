<div id="node-{{ stage.name }}" class="pipeline-node group relative rounded-xl p-4 transition-all duration-200 border {% if stage.enabled %}glass-card border-indigo-500/50 hover:border-indigo-400{% else %}bg-gray-950/60 border-dashed border-gray-700 opacity-60 hover:opacity-90{% endif %}">
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm {% if stage.enabled %}bg-indigo-600 text-white shadow-md{% else %}bg-gray-800 text-gray-500{% endif %}">
                {% if stage.enabled %}⚡{% else %}⏭️{% endif %}
            </div>
            <div>
                <h4 class="font-bold text-white text-sm tracking-tight flex items-center gap-2">
                    <span>{{ stage.label }}</span>
                    <span class="text-[10px] font-mono px-1.5 py-0.5 rounded {% if stage.scope == 'series' %}bg-purple-950 text-purple-300 border border-purple-800{% else %}bg-blue-950 text-blue-300 border border-blue-800{% endif %} uppercase">
                        {{ stage.scope }}
                    </span>
                </h4>
                <p class="text-xs font-mono text-gray-400">{{ stage.name }}</p>
            </div>
        </div>

        <!-- Toggle Switch -->
        <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
            <input type="checkbox" {% if stage.enabled %}checked{% endif %} 
                   class="sr-only peer"
                   onchange="toggleStage('{{ stage.name }}', this.checked, '{{ series_key or '' }}')">
            <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
        </label>
    </div>

    <p class="text-xs text-gray-400 mt-2 line-clamp-2">{{ stage.description }}</p>

    {% if not stage.enabled %}
    <div class="mt-2 text-[10px] font-semibold text-amber-400 uppercase tracking-wider flex items-center gap-1">
        <span>⚠️ Em Bypass (Etapa será saltada)</span>
    </div>
    {% endif %}
</div>
